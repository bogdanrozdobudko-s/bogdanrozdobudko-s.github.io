<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <form action="https://lm.ciclo.iesnervion.es/registro.php" method="POST">
        <fieldset>
            <legend><h3>Registro</h3></legend>

            <label for="codigo"><b>Código del alumno: </b></label>
            <input type="text" pattern="[A-Z]{3}[0-9]{3}" name="codigo" placeholder="DAM123" required/>
            <br/><br/>

            <label for="email"><b>Email: </b></label>
            <input type="email" name="email" placeholder="usuario@org.com" required/>
            <br/><br/>

            <label for="edad"><b>Edad: </b></label>
            <input type="number" name="edad" min="16" max="65" required/>
            <br/><br/>

            <label for="telefono"><b>Teléfono de contacto: </b></label>
            <input type="tel" pattern="[0-9]{9}" name="telefono" placeholder="603XXXXXX" required/>
            <br/><br/>

            <label for="web"><b>Sitio web / Portofilio: </b></label>
            <input type="url" name="web" placeholder="http://mi-sitio-web.cc"/>
            <br/><br/>

            <label for="ide"><b>IDE preferido: </b></label>
            <input list="ide_selection" name="ide"/>
            <datalist id="ide_selection">
                <option value="IntelliJ IDEA">IntelliJ IDEA</option>
                <option value="Visual Studio Code">Visual Studio Code</option>
                <option value="Eclipse">Eclipse</option>
                <option value="Android Studio">Android Studio</option>
                <option value="">No tengo IDE preferido</option>
            </datalist>
            <br/><br/>

            <label for="politica"><b>Acepto la política de privacidad</b></label>
            <input type="checkbox" name="politica" required/>

        </fieldset>
        <button type="submit">Enviar datos</button>
    </form>
</body>
</html>
