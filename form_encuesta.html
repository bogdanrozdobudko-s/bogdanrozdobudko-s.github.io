<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta</title>
</head>
<body>

    <h1>Encuesta sobre el Perfil Técnico de los Estudiantes</h1>

    <form action="https://lm.ciclo.iesnervion.es/encuesta.php" method="POST">
        <fieldset>

            <legend><h3>Datos Académicos</h3></legend>
            <label for="nombre"><b>Nombre y Apellido(s): </b></label>
            <input type="text" placeholder="Tu nombre" name="nombre" required>

            <br/><br/>

            <label for="ciclo"><b>Ciclo Formativo: </b></label>
            <select name="ciclo">
                <option value="dam">DAM</option>
                <option value="daw">DAW</option>
                <option value="asir">ASIR</option>
                <option value="">-- Elige una opción --</option>
            </select>

            
        </fieldset>
        <fieldset>
            <legend><h3>Preferencias Técnicas</h3></legend>
            <p><b>Lenguage de programación: </b></p>
            <label for="lenguaje">Java</label>
            <input type="radio" name="lenguaje" value="java"/>

            <label for="lenguaje">Python</label>
            <input type="radio" name="lenguaje" value="python"/>

            <label for="lenguaje">C#</label>
            <input type="radio" name="lenguaje" value="csharp"/>

            <label for="lenguaje">JavaScript</label>
            <input type="radio" name="lenguaje" value="javascript"/>

            <br/><br/>

            <p><b>Entornos de trabajo habituales: </b></p>

            <input type="checkbox" name="entornos[]" value="Linux">
            <label for="entornos">Linux</label>

            <input type="checkbox" name="entornos[]" value="Windows">
            <label for="entornos">Windows</label>

            <input type="checkbox" name="entornos[]" value="macOS">
            <label for="entornos">macOS</label>

            <br><br>

            <label for="comentarios">Comentarios / Experiencia previa:</label>
            <br>
            <textarea id="comentarios" name="comentarios"
                      rows="4" cols="40"></textarea>

        </fieldset>

        <button type="reset">Restablecer</button>
        <button type="submit">Enviar datos</button>
    </form>
</body>
</html>
