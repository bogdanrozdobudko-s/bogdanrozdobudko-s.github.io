<!DOCTYPE html>
<html lang="ru">
<head>
    <meta content="text/html; charset=utf-8" />
    <title>Bogdan's Website</title>
</head>
<body>
	<p>Video about HTML5:</p>

	<iframe loading="lazy" width="560" height="315" src="https://www.youtube.com/embed/WSFT4OQF_mA?si=55LN2PJEAPY7kkDx" title="What is HTML5" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

	<p>A PDF file:</p>

	<embed src="media/apuntes.pdf" type="application/pdf" width="100%" height="500px">
		FIle
	</embed>

	<p>Object:</p>

	<object data="https://www.wikipedia.org" type="text/html">
		Tu navegador no admite la visualización de este objeto incrustado
	</object>

	<p>Video: </p>

	<video controls width="640" poster="media/portada.jpg">
		<source src="media/muestra.mp4" type="video/mp4"/>
		<source src="media/muestra.webm" type="video/webm"/>
		Your browser does not support this multimedia
	</video>

	<p>Audio: </p>

	<audio controls>
		<source src="media/pista.mp3" type="audio/mpeg"/>
		<source src="media/pista.ogg" type="audio/ogg"/>
		Your browser does not support this multimedia
	</audio>

	<p>SVG: </p>

	<svg width="200" height="100">
	    <rect x="10" y="10" width="80" height="80" fill="blue"/>
	    <circle cx="140" cy="50" r="40" fill="yellow" stroke="red"/>
	</svg>

	<p>Canvas: </p>

	<canvas id="miLienzo" width="300" height="150">
		Tu navegador no soporta el elemento Canvas
	</canvas>

	<script>
		  const canvas = document.getElementById('miLienzo');
		  const ctx = canvas.getContext('2d');
		  ctx.fillStyle = 'green';
		  ctx.fillRect(10, 10, 150, 80);
		  ctx.moveTo(0, 0);
		  ctx.lineTo(200, 100);
		  ctx.stroke();
	</script>

</body>
</html>
